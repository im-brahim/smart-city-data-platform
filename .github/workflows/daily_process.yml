name: Smart City Daily Data Processing

on:
    schedule:
        - cron: 0 0 * * *   
    workflow_dispatch: 

jobs:
    process-smart-city:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v6

            - name: Set up Python 3.11.16
              uses: actions/setup-python@v7
              with:
                python-version: '3.11.16'
            
            # Replicate local venv dependencies exactly
            - name: Install Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install boto3==1.43.62 pandas==3.0.5 python-dotenv
    
            - name: Import Cloud Envirnements & Run Python Script
              env:
                B2_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
                B2_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                B2_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                B2_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
              run: |
                python pipeline/process_city_data.py




