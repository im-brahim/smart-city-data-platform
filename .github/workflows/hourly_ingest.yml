name: Smart City Hourly Data Ingestion

on:
  schedule:
    - cron: '0 * * * *'  # Triggered automatically every hour at minute 0
  workflow_dispatch:      # Enables a manual "Run workflow" button in GitHub UI

jobs:
  ingest-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install boto3 python-dotenv requests

      - name: Execute Cloud Ingestion Script
        env:
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          TRAFFIC_API: ${{ secrets.TRAFFIC_API }}
          WEATHER_API: ${{ secrets.WEATHER_API }}
        run: |
          python scripts/cloud_ingest.py
